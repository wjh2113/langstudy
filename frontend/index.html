<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>LangStudy 听说练习</title>
    <script>
      // apply the saved theme / palette before first paint (no flash)
      try {
        var t = localStorage.getItem('ls.theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        var p = localStorage.getItem('ls.palette')
        if (p === 'coral' || p === 'amber') document.documentElement.dataset.palette = p
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
